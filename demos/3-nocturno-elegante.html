<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 3 · Nocturno Elegante / Dark Obsidian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0E1015;
            --surface-color: #161922;
            --surface-hover: #1E222D;
            --text-color: #EDEDED;
            --text-muted: #8E95A5;
            --border-color: #272B38;
            --accent: #E5A84B;
            --accent-contrast: #0E1015;
            --header-bg: rgba(14, 16, 21, 0.85);
            --font-serif: 'Cinzel', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --glow: 0 0 25px rgba(229, 168, 75, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.6;
        }
        .container { max-width: 1220px; margin: 0 auto; padding: 0 1.75rem; }

        .hero-nocturne {
            padding: 4.5rem 0 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            background: radial-gradient(circle at 50% 0%, #202636 0%, var(--bg-color) 70%);
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(229, 168, 75, 0.1);
            border: 1px solid rgba(229, 168, 75, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
        }
        .hero-nocturne h1 {
            font-family: var(--font-serif);
            font-size: 3rem;
            letter-spacing: 0.02em;
            color: #FFFFFF;
            margin-bottom: 0.75rem;
        }
        .hero-nocturne p {
            color: var(--text-muted);
            max-width: 540px;
            margin: 0 auto 2rem;
            font-size: 1.05rem;
        }

        .stats-hud {
            display: inline-flex;
            gap: 2rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .stats-hud strong { color: var(--accent); }

        /* Filter Controls */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 2.5rem 0 1.5rem;
        }
        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tag-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tag-btn.active, .tag-btn:hover {
            background: var(--surface-hover);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: var(--glow);
        }
        .dark-search {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #FFF;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            font-size: 0.85rem;
            min-width: 250px;
            outline: none;
            font-family: inherit;
        }
        .dark-search:focus { border-color: var(--accent); }

        /* Grid */
        .night-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 2rem 1.5rem;
            padding-bottom: 5rem;
        }
        .night-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .night-card:hover {
            transform: translateY(-5px);
            border-color: rgba(229, 168, 75, 0.4);
            box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5), var(--glow);
        }
        .night-cover {
            position: relative;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            overflow: hidden;
            background: #111319;
            margin-bottom: 0.85rem;
        }
        .night-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .night-card:hover .night-cover img { transform: scale(1.04); }

        .badge-night {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            background: rgba(14, 16, 21, 0.85);
            border: 1px solid rgba(229, 168, 75, 0.4);
            color: var(--accent);
            text-transform: uppercase;
            backdrop-filter: blur(6px);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.3;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-author {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }
        .card-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
        }
        .gold-stars {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        /* Modal Nocturno */
        .modal-night {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-night-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.75rem;
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), var(--glow);
        }
        .modal-night-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: #FFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    
    <div style="position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); background: var(--header-bg); padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-family: system-ui, sans-serif;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <a href="index.html" style="font-weight: 700; color: var(--text-color); text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Galería de Estilos</span>
            </a>
            <span style="opacity: 0.4;">|</span>
            <span style="opacity: 0.7;">Viendo: <strong>Nocturno Elegante</strong></span>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <a href="1-editorial-clasico.html" style="text-decoration: none; padding: 0.35rem 0.75rem; border-radius: 9999px; font-weight: 500; font-size: 0.8rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);">1. Clásico Cálido</a>
            <a href="2-minimalista-nordico.html" style="text-decoration: none; padding: 0.35rem 0.75rem; border-radius: 9999px; font-weight: 500; font-size: 0.8rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);">2. Minimalista Nórdico</a>
            <a href="3-nocturno-elegante.html" style="text-decoration: none; padding: 0.35rem 0.75rem; border-radius: 9999px; font-weight: 500; font-size: 0.8rem; background: var(--accent); color: var(--accent-contrast);">3. Nocturno Studio</a>
        </div>
    </div>
    

    <header class="hero-nocturne">
        <div class="container">
            <div class="hero-badge">✦ Nocturne Reading Lounge</div>
            <h1>Joxan's Library</h1>
            <p>Crítica literaria, ensayos y colección personal bajo una atmósfera nocturna.</p>
            <div class="stats-hud">
                <span>📚 <strong>17</strong> Obras</span>
                <span>⏳ <strong>2</strong> En curso</span>
                <span>⭐ <strong>4.2</strong> Promedio</span>
                <span>🌙 <strong>5.986</strong> Páginas</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls-row">
            <div class="filter-tags">
                <button class="tag-btn active" onclick="filterNight('all', this)">Colección Completa (17)</button>
                <button class="tag-btn" onclick="filterNight('read', this)">Leídos (14)</button>
                <button class="tag-btn" onclick="filterNight('currently-reading', this)">Leyendo Ahora (2)</button>
                <button class="tag-btn" onclick="filterNight('top', this)">Imprescindibles 5★ (5)</button>
                <button class="tag-btn" onclick="filterNight('did-not-finish', this)">Abandonados (1)</button>
            </div>
            <input type="text" id="nightSearch" class="dark-search" placeholder="Buscar por título o autor..." onkeyup="searchNight()">
        </div>

        <div class="night-grid" id="nightGrid"></div>
    </main>

    <!-- Modal Review -->
    <div class="modal-night" id="nightModal" onclick="closeNightModal(event)">
        <div class="modal-night-card" onclick="event.stopPropagation()">
            <button class="modal-night-close" onclick="closeNightModal()">&times;</button>
            <div id="nightModalBody"></div>
        </div>
    </div>

    <script>
        const books = [{"title": "Redshirts", "author": "John Scalzi", "isbn13": "9788445001905", "isbn": "8445001906", "rating": 0, "status": "did-not-finish", "pages": "348", "year": "2012", "dateRead": "", "publisher": "Minotauro"}, {"title": "Al sur de la frontera, al oeste del Sol", "author": "Haruki Murakami", "isbn13": "9788483835036", "isbn": "8483835037", "rating": 0, "status": "currently-reading", "pages": "270", "year": "1992", "dateRead": "", "publisher": "Maxi-Tusquets"}, {"title": "Al este del Edén", "author": "John Steinbeck", "isbn13": "9788490661444", "isbn": "8490661448", "rating": 0, "status": "currently-reading", "pages": "688", "year": "1952", "dateRead": "", "publisher": "Austral"}, {"title": "Noches blancas y otros relatos", "author": "Fyodor Dostoevsky", "isbn13": "9788420665665", "isbn": "8420665665", "rating": 4, "status": "read", "pages": "223", "year": "1848", "dateRead": "2026/09/20", "publisher": "Alianza Editorial"}, {"title": "1984", "author": "George Orwell", "isbn13": "9791387788452", "isbn": "", "rating": 5, "status": "read", "pages": "320", "year": "1949", "dateRead": "2026/09/13", "publisher": "Newton Compton Editores"}, {"title": "La quinta víctima (4MK Thriller, #2)", "author": "J.D. Barker", "isbn13": "9788423357581", "isbn": "8423357589", "rating": 4, "status": "read", "pages": "608", "year": "2018", "dateRead": "2026/09/07", "publisher": "Booket"}, {"title": "Otra vuelta de tuerca", "author": "Henry James", "isbn13": "9788481302189", "isbn": "848130218", "rating": 4, "status": "read", "pages": "119", "year": "1898", "dateRead": "2026/09/02", "publisher": "Bibliotex"}, {"title": "El cuarto mono (El cuarto mono, #1)", "author": "J.D. Barker", "isbn13": "9788423355655", "isbn": "8423355659", "rating": 4, "status": "read", "pages": "560", "year": "2017", "dateRead": "2026/08/31", "publisher": "Booket"}, {"title": "La metamorfosis", "author": "Franz Kafka", "isbn13": "9788420651361", "isbn": "8420651362", "rating": 5, "status": "read", "pages": "125", "year": "1915", "dateRead": "2026/08/30", "publisher": "Alianza Editorial"}, {"title": "Por una causa justa (Estalingrado, #1)", "author": "Vasily Grossman", "isbn13": "9788481099119", "isbn": "8481099112", "rating": 4, "status": "read", "pages": "1100", "year": "1952", "dateRead": "2026/08/29", "publisher": "Galaxia Gutenberg"}, {"title": "La carretera", "author": "Cormac McCarthy", "isbn13": "9788439741008", "isbn": "8439741006", "rating": 5, "status": "read", "pages": "216", "year": "2006", "dateRead": "2026/08/27", "publisher": "Literatura Random House"}, {"title": "El honor perdido de Katharina Blum", "author": "Heinrich Böll", "isbn13": "9788481301649", "isbn": "8481301647", "rating": 3, "status": "read", "pages": "120", "year": "1974", "dateRead": "2026/08/26", "publisher": "Colección Millenium (El Mundo)"}, {"title": "La luna se ha puesto", "author": "John Steinbeck", "isbn13": "9788435021876", "isbn": "8435021874", "rating": 4, "status": "read", "pages": "160", "year": "1942", "dateRead": "2026/08/24", "publisher": "Editora y Distribuidora Hispano Americana, S.A."}, {"title": "El extraño caso del Dr. Jekill y Mr. Hyde", "author": "Robert Louis Stevenson", "isbn13": "9789871784073", "isbn": "9871784074", "rating": 4, "status": "read", "pages": "0", "year": "1886", "dateRead": "2026/08/20", "publisher": "SALIM"}, {"title": "La perla", "author": "John Steinbeck", "isbn13": "9788431634797", "isbn": "8431634790", "rating": 5, "status": "read", "pages": "160", "year": "1947", "dateRead": "2026/08/17", "publisher": "Editorial Vicens Vives"}, {"title": "Maite", "author": "Fernando Aramburu", "isbn13": "9788411077484", "isbn": "8411077489", "rating": 3, "status": "read", "pages": "344", "year": "2026", "dateRead": "2026/08/08", "publisher": "Tusquets Editores S.A."}, {"title": "El Día D: La batalla de Normandía", "author": "Antony Beevor", "isbn13": "9788498920208", "isbn": "8498920205", "rating": 5, "status": "read", "pages": "784", "year": "2009", "dateRead": "2026/08/06", "publisher": "Editorial Crítica"}];
        books.forEach((b, i) => b.index = i);

        function renderNight(list) {
            const grid = document.getElementById('nightGrid');
            grid.innerHTML = list.map(b => {
                const isbn = b.isbn13 || b.isbn;
                let badge = '';
                if (b.status === 'currently-reading') badge = '<span class="badge-night">Leyendo</span>';
                else if (b.status === 'did-not-finish') badge = '<span class="badge-night" style="color:#A0A0A0; border-color:#555;">DNF</span>';

                const stars = b.rating > 0 ? '★'.repeat(b.rating) + '☆'.repeat(5 - b.rating) : '<span style="color:#666;font-size:0.75rem;">Sin valorar</span>';

                return `
                <div class="night-card" onclick="openNightReview(${b.index})">
                    <div class="night-cover">
                        ${badge}
                        <img src="https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false" 
                             alt="${b.title}" 
                             loading="lazy"
                             onerror="this.src='https://placehold.co/220x330/161922/E5A84B?text=${encodeURIComponent(b.title)}'">
                    </div>
                    <div class="card-title" title="${b.title}">${b.title}</div>
                    <div class="card-author">${b.author}</div>
                    <div class="card-bottom">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${b.year} · ${b.pages}p</span>
                        <span class="gold-stars">${stars}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterNight(type, btn) {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            let filtered = books;
            if (type === 'read') filtered = books.filter(b => b.status === 'read');
            else if (type === 'currently-reading') filtered = books.filter(b => b.status === 'currently-reading');
            else if (type === 'did-not-finish') filtered = books.filter(b => b.status === 'did-not-finish');
            else if (type === 'top') filtered = books.filter(b => b.rating === 5);

            renderNight(filtered);
        }

        function searchNight() {
            const q = document.getElementById('nightSearch').value.toLowerCase();
            renderNight(books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)));
        }

        function openNightReview(idx) {
            const b = books[idx];
            const isbn = b.isbn13 || b.isbn;
            const body = document.getElementById('nightModalBody');

            body.innerHTML = `
                <div style="display: flex; gap: 2rem; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap;">
                    <div style="width: 140px; aspect-ratio: 2/3; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: var(--glow);">
                        <img src="https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://placehold.co/140x210/161922/E5A84B?text=${encodeURIComponent(b.title)}'">
                    </div>
                    <div style="flex: 1; min-width: 260px;">
                        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--accent); letter-spacing: 0.1em; font-weight: 700;">Crítica & Análisis</span>
                        <h2 style="font-family: var(--font-serif); font-size: 2.2rem; color: #FFF; margin: 0.3rem 0; line-height: 1.2;">${b.title}</h2>
                        <p style="color: var(--text-muted); font-size: 1.1rem;">Autor: <strong style="color: #FFF;">${b.author}</strong></p>
                        <div style="margin-top: 0.8rem; font-size: 1.1rem; color: var(--accent); letter-spacing: 2px;">
                            ${'★'.repeat(b.rating || 0)}
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; background: #12141C; padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 2rem; font-size: 0.85rem;">
                    <div><span style="color: var(--text-muted);">Editorial:</span><br><strong style="color:#FFF;">${b.publisher}</strong></div>
                    <div><span style="color: var(--text-muted);">Páginas:</span><br><strong style="color:#FFF;">${b.pages}</strong></div>
                    <div><span style="color: var(--text-muted);">Publicación:</span><br><strong style="color:#FFF;">${b.year}</strong></div>
                    <div><span style="color: var(--text-muted);">Fecha Lectura:</span><br><strong style="color:#FFF;">${b.dateRead || 'En curso'}</strong></div>
                </div>

                <div style="font-size: 1.05rem; line-height: 1.8; color: #D1D5DB;">
                    <p style="margin-bottom: 1.25rem;">
                        ${b.title === 'La carretera' 
                            ? 'Una experiencia sobrecogedora y ascética. Cormac McCarthy despoja la narrativa de cualquier artificio innecesario para narrar el peregrinaje de un padre y su hijo por una tierra calcinada por una catástrofe sin nombre.' 
                            : b.title === '1984'
                            ? 'Pocas novelas del siglo XX conservan una vigencia tan abrasadora. Orwell no construyó una simple advertencia política, sino un tratado psicológico demoledor sobre el lenguaje, la memoria y el sometimiento absoluto del individuo.'
                            : 'Un análisis implacable de los conflictos interiores humanos, articulado con una intensidad que deja huella permanente en el lector.'}
                    </p>

                    <blockquote style="border-left: 3px solid var(--accent); background: rgba(229, 168, 75, 0.08); padding: 1.25rem 1.5rem; border-radius: 0 8px 8px 0; margin: 1.75rem 0; font-style: italic; color: #F3F4F6;">
                        "${b.title === 'La carretera'
                            ? 'Sabía que el niño era su garantía. Si él no era la palabra de Dios, Dios no había hablado nunca.'
                            : b.title === '1984'
                            ? 'La libertad es proclamar que dos y dos son cuatro. Si se concede esto, todo lo demás vendrá por sí solo.'
                            : 'Hay libros que se leen; otros, los más raros, nos leen a nosotros con una claridad implacable.'}"
                        <div style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--accent); font-style: normal;">— Pasaje memorable</div>
                    </blockquote>

                    <p style="margin-bottom: 1.5rem;">
                        McCarthy maneja los silencios con la misma maestría que las palabras. Cada descripción de las cenizas o el frío cala hondo, logrando una de las obras cumbres de este milenio.
                    </p>

                    <details style="background: #151821; border: 1px solid var(--border-color); border-radius: 10px; padding: 1.25rem;">
                        <summary style="cursor: pointer; font-weight: 700; color: var(--accent);">⚠️ Reflexión de Cierre (Contiene Spoilers)</summary>
                        <p style="margin-top: 0.85rem; font-size: 0.95rem; color: #9CA3AF;">
                            El encuentro final con la familia no es un final feliz ingenuo, sino el reconocimiento de que llevar el fuego no es una metáfora vacía: es la persistencia de la empatía humana.
                        </p>
                    </details>
                </div>
            `;
            document.getElementById('nightModal').style.display = 'flex';
        }

        function closeNightModal() {
            document.getElementById('nightModal').style.display = 'none';
        }

        renderNight(books);
    </script>
</body>
</html>
